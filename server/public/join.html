<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>AI 홀덤 · 참가</title>
    <script src="/theme-boot.js"></script>
    <link rel="preload" href="/font-pretendard-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/font-space-grotesk.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/design-tokens.css" />
    <link rel="stylesheet" href="/ui-base.css" />
    <link rel="stylesheet" href="/join.css" />
    <script type="module" src="/join-bootstrap.js"></script>
  </head>
  <body class="ui-page join">
    <header class="app-header">
      <span class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C9.2 6.6 4.5 9.3 4.5 13.2 4.5 15.6 6.3 17.2 8.4 17.2 9.6 17.2 10.6 16.7 11.3 15.9 11.1 17.8 10.3 19.3 8.9 20.3L8.9 21.5 15.1 21.5 15.1 20.3C13.7 19.3 12.9 17.8 12.7 15.9 13.4 16.7 14.4 17.2 15.6 17.2 17.7 17.2 19.5 15.6 19.5 13.2 19.5 9.3 14.8 6.6 12 2Z" /></svg><strong>AI 홀덤</strong></span>
      <p id="shell-context" class="shell-context" hidden></p>
      <span class="header-spacer"></span>
      <div id="member-controls" class="member-controls" hidden>
        <p id="member-role" class="member-role" role="status"></p>
        <button type="button" id="seat-request" class="ui-btn ui-btn--secondary" hidden>다음 게임 참가</button>
        <button type="button" id="leave" class="ui-btn ui-btn--ghost">나가기</button>
      </div>
      <div class="help-menu"><button type="button" id="help-menu" class="ui-btn ui-btn--quiet" aria-expanded="false" aria-controls="help-menu-list"><span class="help-menu__label">도움말·설정</span></button
        ><div id="help-menu-list" class="help-menu__list" hidden><button type="button" id="open-help" class="ui-btn ui-btn--quiet">도움말</button><button type="button" id="open-display-settings" class="ui-btn ui-btn--quiet">표시 설정</button></div></div>
    </header>
    <main class="join-main">
      <p id="ai-provider" class="ui-banner ui-banner--info jev-banner" role="status" hidden></p>
      <section id="join-panel" class="join-card" aria-labelledby="join-title">
        <h1 id="join-title" class="ui-h1">테이블에 참가</h1>
        <form id="join-form" class="join-form">
          <div class="ui-field"><label class="ui-label" for="join-code">참가 코드</label><input id="join-code" class="ui-input join-code" name="code" required autocomplete="off" spellcheck="false" /></div>
          <div class="ui-field"><label class="ui-label" for="join-name">이름</label><input id="join-name" class="ui-input" name="name" required maxlength="12" autocomplete="nickname" /></div>
          <button type="submit" id="join-submit" class="ui-btn ui-btn--primary ui-btn--lg ui-btn--block">참가하기</button>
        </form>
        <p class="join-intro">게임 시작 후 입장하면 관전자로 참여하며, 관전자에게는 모든 카드가 공개됩니다.</p>
        <p class="join-intro join-transfer">호스트가 JEV 모드를 고르면 공개 플레이 정보와 각 AI의 자기 패가 TypeSafe AI로 전송됩니다. 참가자의 패와 이름은 보내지 않습니다. <span id="join-transfer-help"></span></p>
      </section>
      <p id="join-error" class="join-error" role="alert"></p>
      <section id="waiting" class="join-card waiting" hidden aria-labelledby="waiting-status">
        <p class="waiting-pulse" aria-hidden="true"><span></span></p>
        <h2 id="waiting-status" class="ui-h2">호스트가 시작하기를 기다리는 중</h2>
        <p id="waiting-summary" class="ui-muted"></p>
        <ul id="waiting-participants" class="waiting-list" aria-label="참가자"></ul>
      </section>
      <section id="playing" hidden>
        <p id="pause-banner" class="pause-banner" role="status" hidden>호스트가 일시정지했습니다</p>
        <iframe id="table" title="홀덤 테이블"></iframe>
      </section>
      <section id="final" class="join-card final" hidden aria-labelledby="final-title">
        <h2 id="final-title" class="ui-h2">최종 결과</h2>
        <p id="final-reason" class="ui-muted"></p>
        <table id="final-stacks"></table><div id="final-details"></div>
      </section>
    </main>
  </body>
</html>
