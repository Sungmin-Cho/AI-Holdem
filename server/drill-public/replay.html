<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>플레이 기록 · AI 홀덤</title>
  <script src="/theme-boot.js"></script>
  <link rel="stylesheet" href="/design-tokens.css">
  <link rel="stylesheet" href="/ui-base.css">

  <script type="module" src="/replay.js"></script>

<body class="ui-page replay-library" data-no-onboarding>
  <header class="app-header">
    <strong class="brand">AI 홀덤 <span class="brand-sub">플레이 기록</span></strong>
    <label>금액 단위 <select id="replay-unit" aria-label="금액 단위"><option value="chips">칩</option><option value="bb">BB</option></select></label>

    <nav id="library-nav" aria-label="기록 탐색"></nav>
    <section id="library-content" aria-label="기록 목록" tabindex="-1"></section>
