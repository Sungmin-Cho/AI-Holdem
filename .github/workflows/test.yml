name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A Windows run takes over an hour and bills at twice the rate. A push that
# supersedes one must not leave it running to completion beside the new run.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Windows shards (measured minutes on run 6943f18, Node 22, before D5):
#   study-a    study-service                         ≈ 21.5
#   study-b    study-service-recovery                ≈ 23.5
#   learning-a learning-integration + mistake-bank + publish ≈ 19.7
#   learning-b learning-integration-session + action-receipts + drill-* ≈ 20.3
#   loop       game-loop + release-verifier + server-security-gates ≈ 23
#   rest       remaining test files + step 6 GATE    ≈ 21
# Rebalance only by moving NAMED's small files (mistake-bank, publish,
# action-receipts, drill-*). Do not split files further. Keep max ≤ 30 min
# and max/min ≤ 1.5 after the first full matrix.
jobs:
  test:
    name: Node ${{ matrix.node-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        node-version:
          - 20.x
          - 22.x
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node-version }}
      - name: Verify learning runtime on the runner platform
        run: node --test --test-concurrency=1 test/platform-learning-runtime.test.js
      - name: Run tests
        run: npm run test:ci
  windows:
    name: Node ${{ matrix.node-version }} (windows-latest, ${{ matrix.shard }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20.x
          - 22.x
        shard:
          - study-a
          - study-b
          - learning-a
          - learning-b
          - loop
          - rest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node-version }}
      - name: Prepare Windows diagnostics directory
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'holdem-diag'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          echo "AI_HOLDEM_PLATFORM_DIAGNOSTICS=$dir" >> $env:GITHUB_ENV
      - name: Verify Windows private directory creation
        run: node test/helpers/windows-privacy-probe.mjs
      - name: Verify the Windows child environment can prove privacy
        run: node test/helpers/windows-child-environment-probe.mjs
      - name: Verify learning runtime on the runner platform
        if: matrix.shard == 'rest'
        run: node --test --test-concurrency=1 test/platform-learning-runtime.test.js
      - name: Run tests
        run: npm run test:ci:windows -- ${{ matrix.shard }}
      - name: Report Windows proof profile
        if: always()
        run: |
          $file = Join-Path $env:AI_HOLDEM_PLATFORM_DIAGNOSTICS 'proofs.jsonl'
          if (Test-Path $file) { node test/helpers/proof-profile-report.mjs $file } else { echo 'no proofs.jsonl' }
          $log = Join-Path $env:AI_HOLDEM_PLATFORM_DIAGNOSTICS 'study-children.log'
          if (Test-Path $log) { Get-Content $log }
  windows-suite:
    name: Windows suite
    needs: windows
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every Windows shard
        run: test "${{ needs.windows.result }}" = "success"
