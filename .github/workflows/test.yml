name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A Windows run takes over an hour and bills at twice the rate. A push that
# supersedes one must not leave it running to completion beside the new run.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Windows baseline: main 2456291, run 34954055586, Node 20.x.
# Run-tests minutes: loop 38.6 (game-loop 32.0), rest 56.3 + gate 1.2;
# rest job reached 58/60 minutes. Job overhead was about one minute.
# New partition: estimated run-tests minutes (verify on PR CI, not guarantees):
#   study-a    study-service + app-command-store + policy-loop 17.7
#   study-b    study-service-recovery                         11.6
#   learning-a learning-integration + mistake-bank + publish  11.0
#   learning-b learning-integration-session + action-receipts + drill-* 12.9
#   loop       game-loop                                     32.0
#   recovery   app-recovery-exit + release-verifier + server-security-gates 28.6
#   rest       remaining files + GATE                        26.1
# Targets: jobs <= 40 min, files <= 36 min; caps remain 60 and 45 min.
# If game-loop.test.js exceeds 36 min on Windows, split by topic starting
# with coach recovery/finalize. Track app-recovery-exit's 22.1 min separately.
# Seven shards x Node 20/22 adds two jobs and their fixed overhead.
jobs:
  ui-browser:
    name: UI browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.x
      - name: Install pinned browser and dependencies
        run: npx --yes agent-browser@0.36.0 install --with-deps
      - name: Check UI presentation
        run: npm run test:ui:browser -- --ci
      - name: Fresh-session recovery browser journey
        run: node test/browser/fresh-session-journey.mjs --out-dir output/playwright/ui-journey/fresh-session
      - name: Unverifiable recovery exit browser journey
        run: node test/browser/recovery-exit-journey.mjs --out-dir output/playwright/ui-journey/recovery-exit
      - name: Multiplayer spectator real-play journey
        run: node test/browser/spectator-journey.mjs --out-dir output/playwright/ui-journey/spectator
      - name: Preserve UI check results and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-browser-evidence
          path: output/playwright/ui-journey/
          retention-days: 7
  windows-publisher:
    name: Publisher shutdown (Windows Node 24.12.0)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.12.0
      - name: Prepare cold Windows privacy dependencies
        timeout-minutes: 3
        run: node test/helpers/windows-privacy-probe.mjs --cold-start
      - name: Verify Windows private directory creation
        run: node test/helpers/windows-privacy-probe.mjs
      - name: Verify publisher exit on the reported Node version
        run: node --test --test-name-pattern="publish shutdown:" test/publish.test.js
  test:
    name: Node ${{ matrix.node-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        node-version:
          - 20.x
          - 22.x
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node-version }}
      - name: Verify learning runtime on the runner platform
        run: node --test --test-concurrency=1 test/platform-learning-runtime.test.js
      - name: Run tests
        run: npm run test:ci
  windows:
    name: Node ${{ matrix.node-version }} (windows-latest, ${{ matrix.shard }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20.x
          - 22.x
        shard:
          - study-a
          - study-b
          - learning-a
          - learning-b
          - loop
          - loop-b
          - recovery
          - rest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node-version }}
      - name: Prepare Windows diagnostics directory
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'holdem-diag'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          echo "AI_HOLDEM_PLATFORM_DIAGNOSTICS=$dir" >> $env:GITHUB_ENV
      # Hosted images may spend most of the first call loading Windows
      # PowerShell/.NET and compiling the native directory helper. Preparation
      # proves the actual ACL/lock under a bounded cold budget; the gate below
      # repeats the same operations with the unchanged production 15s cap.
      - name: Prepare cold Windows privacy dependencies
        timeout-minutes: 3
        run: node test/helpers/windows-privacy-probe.mjs --cold-start
      - name: Verify Windows private directory creation
        run: node test/helpers/windows-privacy-probe.mjs
      - name: Verify the Windows child environment can prove privacy
        run: node test/helpers/windows-child-environment-probe.mjs
      - name: Verify learning runtime on the runner platform
        if: matrix.shard == 'rest'
        run: node --test --test-concurrency=1 test/platform-learning-runtime.test.js
      - name: Verify fresh retry recovery before the long study shard
        if: matrix.shard == 'study-a'
        run: node --test --test-name-pattern="fresh retry command forwards" test/app-command-store.test.js
      - name: Run tests
        run: npm run test:ci:windows -- ${{ matrix.shard }}
      - name: Report Windows proof profile
        if: always()
        run: |
          $file = Join-Path $env:AI_HOLDEM_PLATFORM_DIAGNOSTICS 'proofs.jsonl'
          if (Test-Path $file) { node test/helpers/proof-profile-report.mjs $file } else { echo 'no proofs.jsonl' }
          $log = Join-Path $env:AI_HOLDEM_PLATFORM_DIAGNOSTICS 'study-children.log'
          if (Test-Path $log) { Get-Content $log }
  windows-suite:
    name: Windows suite
    needs: windows
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every Windows shard
        run: test "${{ needs.windows.result }}" = "success"
