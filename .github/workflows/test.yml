name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A Windows run takes over an hour and bills at twice the rate. A push that
# supersedes one must not leave it running to completion beside the new run.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Every privacy proof on Windows is a PowerShell child of about a second, and
    # the suite runs its files one at a time because they spawn real services and
    # share lock state. That puts a full Windows run near 75 minutes against 10 on
    # Linux; the run cancelled at 60 was still progressing, 1346 tests in.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 120 || 40 }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node-version:
          - 20.x
          - 22.x
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node-version }}
      - name: Verify Windows private directory creation
        if: runner.os == 'Windows'
        run: node test/helpers/windows-privacy-probe.mjs
      - name: Verify the Windows child environment can prove privacy
        if: runner.os == 'Windows'
        run: node test/helpers/windows-child-environment-probe.mjs
      - name: Verify learning runtime on the runner platform
        run: node --test --test-concurrency=1 test/platform-learning-runtime.test.js
      - name: Run tests
        run: npm run test:ci
