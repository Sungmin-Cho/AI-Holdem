name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A Windows run takes over an hour and bills at twice the rate. A push that
# supersedes one must not leave it running to completion beside the new run.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Windows shards (test/helpers/ci-shards.mjs). NAMED pins the heavy files; every
# other top-level *.test.js goes to learning-a, study-b, learning-b or rest by the
# SHA-256 of its basename, weighted 3:2:2:3 (SPREAD), so a new file never moves
# another and new files no longer all land in rest (#317). GATE and the three
# relay tests run only in their own steps (rest, every Linux partition).
# Job minutes, Node 20.x / 22.x, run 39736037467 attempt 1 (PR #318, 04530aa):
#   study-a 19.4 / 18.7   study-b 18.6 / 16.8   learning-a 29.7 / 27.0
#   learning-b 16.9 / 16.5   loop 21.9 / 20.0   loop-b 25.1 / 23.7
#   recovery 17.2 / 16.5   rest 17.6 / 18.5 (74 files; 231 and 47-50 min before)
# upper-background-resolve (6.4 / 6.0 min) then moved from learning-a to NAMED
# learning-b, which puts both near 23 / 21-23. Linux services 25.2 / 16.1,
# rest 20.9 / 16.3 (40 min cap).
# Targets: jobs <= 40 min, files <= 36 min; caps remain 60 and 45 min.
# A shard whose tests run over 35 min writes a ::warning:: annotation. Remeasure
# from attempt 1 of a run (the API returns CRLF logs; tap-file-timing accepts them):
#   gh api "repos/{owner}/{repo}/actions/runs/<run>/attempts/1/jobs?per_page=100" \
#     --jq '.jobs[] | [.id, .name, .started_at, .completed_at] | @tsv'
#   gh api repos/{owner}/{repo}/actions/jobs/<job>/logs > job.log
#   node test/helpers/tap-file-timing.mjs job.log test
#   node test/helpers/ci-shards.mjs list <shard>
# Then pin a heavy file in NAMED or change the SPREAD weights.
# #210 split game-loop.test.js by topic: persisted coach recovery/finalize
# moved to game-loop-finalize.test.js (loop-b), shared fixtures to
# test/helpers/game-loop-fixtures.mjs. If either file exceeds 36 min on Windows,
# split it again by topic.
# Track app-recovery-exit against its 22.1 min baseline separately (#211).
# Eight shards x Node 20/22 include the multiplayer loop partition.
# npm ci skips the audit request: on main ae74aaa a stalled bulk advisory call
# held every install for up to 5 min (npm's fetch-timeout) and cancelled two jobs.
jobs:
  ui-browser:
    name: UI browser
    runs-on: ubuntu-latest
    # 35 successful runs (10-16..10-22) took 12.3-19.8 min: presentation
    # 5.5-8.7, the other journeys 5.9-11.1, installs under 0.5. The registry
    # stall on ae74aaa added 12.3 min of installs and cancelled the job at 20.
    timeout-minutes: 30
    # Every step and journey reaches agent-browser through npx, which otherwise
    # revalidates its registry manifest on each call; with the cache below these
    # calls need no registry. The env is job-level so the Node 26 steps keep it.
    env:
      npm_config_audit: 'false'
      npm_config_fund: 'false'
      npm_config_prefer_offline: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.x
      - name: Restore npm and agent-browser package cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.npm
          key: ui-browser-npm-${{ runner.os }}-agent-browser-0.36.0-${{ hashFiles('package-lock.json') }}
      - name: Install project dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned browser and dependencies
        run: npx --yes agent-browser@0.36.0 install --with-deps
      - name: Prepare protected default game store
        run: mkdir -p "$GITHUB_WORKSPACE/game"
      - name: Check UI presentation
        run: npm run test:ui:browser -- --ci
      - name: Fresh-session recovery browser journey
        run: node test/browser/fresh-session-journey.mjs --out-dir output/playwright/ui-journey/fresh-session
      - name: Unverifiable recovery exit browser journey
        run: node test/browser/recovery-exit-journey.mjs --out-dir output/playwright/ui-journey/recovery-exit
      - name: Multiplayer spectator real-play journey
        run: node test/browser/spectator-journey.mjs --out-dir output/playwright/ui-journey/spectator
      - name: JEV recovery browser journey
        run: node test/browser/jev-journey.mjs --out-dir output/playwright/ui-journey/jev
      - name: Lobby session browser journey
        run: npm run test:lobby:browser
      - name: Multiplayer browser journey
        run: npm run test:multiplayer:browser
      - name: Coaching study next-step browser journey
        run: node test/browser/coaching-study-journey.mjs --out-dir output/playwright/ui-journey/coaching-study
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 26.0.0
      - name: Install project dependencies
        run: npm ci --no-audit --no-fund
      - name: Learning browser journey
        run: node test/browser/learning-journey.mjs --out-dir output/playwright/ui-journey/learning --user-store-dir "$GITHUB_WORKSPACE/game"
      - name: Replay library browser journey
        run: node test/browser/replay-library-journey.mjs --out-dir output/playwright/ui-journey/replay-library
      - name: Preserve UI check results and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-browser-evidence
          path: output/playwright/ui-journey/
          retention-days: 7
  windows-publisher:
    name: Publisher shutdown (Windows Node 24.12.0)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.12.0
      - name: Install project dependencies
        run: npm ci --no-audit --no-fund
      - name: Prepare cold Windows privacy dependencies
        timeout-minutes: 3
        run: node test/helpers/windows-privacy-probe.mjs --cold-start
      - name: Verify Windows private directory creation
        run: node test/helpers/windows-privacy-probe.mjs
      - name: Verify publisher exit on the reported Node version
        run: node --test --test-name-pattern="publish shutdown:" test/publish.test.js
  # Linux runs the full suite as two complete partitions (services, rest) per
  # Node version, each under the 40 minute job cap. A partition with a file
  # list is run by test/helpers/ci-linux-partitions.mjs; GATE runs first.
  test:
    name: Node ${{ matrix.node-version }} (${{ matrix.os }}, ${{ matrix.partition }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        node-version:
          - 20.x
          - 22.x
        partition:
          - services
          - rest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install project dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify learning runtime on the runner platform
        run: node --test --test-concurrency=1 test/platform-learning-runtime.test.js
      - name: Verify relay proxy ownership and transport
        run: node --test --test-concurrency=1 test/relay-access.test.js test/relay-proxy.test.js test/relay-proxy-live.test.js
      - name: Run tests
        run: node test/helpers/ci-linux-partitions.mjs run ${{ matrix.partition }}
  # Keep the existing required status-check names. Both succeed only after
  # every Linux Node/version partition succeeds, including on retry/cancellation.
  linux-suite:
    name: Node ${{ matrix.node-version }} (ubuntu-latest)
    needs: test
    if: always()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20.x
          - 22.x
    steps:
      - name: Require every Linux partition
        env:
          PARTITION_RESULT: ${{ needs.test.result }}
        run: test "$PARTITION_RESULT" = "success"
  windows:
    name: Node ${{ matrix.node-version }} (windows-latest, ${{ matrix.shard }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20.x
          - 22.x
        shard:
          - study-a
          - study-b
          - learning-a
          - learning-b
          - loop
          - loop-b
          - recovery
          - rest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install project dependencies
        run: npm ci --no-audit --no-fund
      - name: Prepare Windows diagnostics directory
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'holdem-diag'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          echo "AI_HOLDEM_PLATFORM_DIAGNOSTICS=$dir" >> $env:GITHUB_ENV
      # Hosted images may spend most of the first call loading Windows
      # PowerShell/.NET and compiling the native directory helper. Preparation
      # proves the actual ACL/lock under a bounded cold budget; the gate below
      # repeats the same operations with the unchanged production 15s cap.
      - name: Prepare cold Windows privacy dependencies
        timeout-minutes: 3
        run: node test/helpers/windows-privacy-probe.mjs --cold-start
      - name: Verify Windows private directory creation
        run: node test/helpers/windows-privacy-probe.mjs
      - name: Verify the Windows child environment can prove privacy
        run: node test/helpers/windows-child-environment-probe.mjs
      - name: Verify learning runtime on the runner platform
        if: matrix.shard == 'rest'
        run: node --test --test-concurrency=1 test/platform-learning-runtime.test.js
      - name: Verify relay proxy ownership and transport
        if: matrix.shard == 'rest'
        run: node --test --test-concurrency=1 test/relay-access.test.js test/relay-proxy.test.js test/relay-proxy-live.test.js
      - name: Verify fresh retry recovery before the long study shard
        if: matrix.shard == 'study-a'
        run: node --test --test-name-pattern="fresh retry command forwards" test/app-command-store.test.js
      - name: Run tests
        run: npm run test:ci:windows -- ${{ matrix.shard }}
      - name: Report Windows proof profile
        if: always()
        run: |
          $file = Join-Path $env:AI_HOLDEM_PLATFORM_DIAGNOSTICS 'proofs.jsonl'
          if (Test-Path $file) { node test/helpers/proof-profile-report.mjs $file } else { echo 'no proofs.jsonl' }
          $log = Join-Path $env:AI_HOLDEM_PLATFORM_DIAGNOSTICS 'study-children.log'
          if (Test-Path $log) { Get-Content $log }
      - name: Upload Windows proof profile
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: proofs-${{ matrix.shard }}-node${{ matrix.node-version }}
          path: ${{ env.AI_HOLDEM_PLATFORM_DIAGNOSTICS }}/proofs.jsonl
          if-no-files-found: ignore
          retention-days: 14
          # A re-run attempt uploads under the same name.
          overwrite: true
  windows-suite:
    name: Windows suite
    needs: windows
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every Windows shard
        run: test "${{ needs.windows.result }}" = "success"
